services:
  # Disposable database for `npm run test:db` (not part of the app stack)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: alerts_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d alerts_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # ---- The app stack. Start it with: docker compose --profile app up -d --build --wait ----
  db:
    image: postgres:16
    profiles: ["app"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: alerts
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d alerts"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["app"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    profiles: ["app"]
    command: ["node", "index.js"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/alerts
      RABBITMQ_URL: amqp://rabbitmq
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    build: .
    profiles: ["app"]
    command: ["node", "alert-consumer.js"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/alerts
      RABBITMQ_URL: amqp://rabbitmq
      WS_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  dbdata: